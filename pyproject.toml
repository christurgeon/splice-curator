[project]
name = "splice-curator"
version = "0.1.0"
description = "Unofficial CLI to search, shortlist, license, download, and organize your own Splice samples."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
chrome = ["pycookiecheat>=0.6"]

[project.scripts]
splice-curator = "splice_curator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splice_curator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
